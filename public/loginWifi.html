<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wi-Fi Guest Authentication</title>
    <style>
        /* สไตล์พื้นฐานสำหรับหน้าจอ Login (เก็บ CSS ไว้ในไฟล์เดียวกันเพื่อลดการโหลดข้ามไซต์) */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* background-color: #134737; */
            background: linear-gradient(135deg, #518f7c 0%, #134737 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            /* background-image: url('/OnenessKV.png'); /* ใส่ชื่อไฟล์รูปภาพของคุณตรงนี้ */
            /* background-size: cover;                 ปรับขนาดรูปให้คลุมเต็มพื้นที่หน้าจอ */
            /* background-position: center;            จัดให้รูปอยู่กึ่งกลางหน้าจอพอดี */
            /* background-repeat: no-repeat;           ตั้งค่าไม่ให้รูปภาพแสดงซ้ำซ้อนกัน */
            /* background-attachment: fixed;           ตรึงรูปพื้นหลังไว้ไม่ให้เลื่อนตามการ Scroll */
            
        }
        .login-box {
            background-color: rgba(255, 255, 255, 0.85); /* เปลี่ยนเป็น rgba: สีขาวที่ความโปร่งใส 85% */
            backdrop-filter: blur(10px);                  /* เพิ่มความเบลอให้พื้นหลังแบบกระจกฝ้า */
            -webkit-backdrop-filter: blur(10px);          /* รองรับเอฟเฟกต์เบลอบนเบราว์เซอร์ Safari (iOS/Mac) */
            padding: 40px;
            border-radius: 16px;                         /* เพิ่มความมนของขอบอีกนิดเพื่อให้เข้ากับสไตล์กระจก */
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);  /* ปรับเงาให้ลึกและนุ่มนวลขึ้นเพื่อให้กล่องดูลอยเด่นขึ้นมา */
            width: 100%;
            max-width: 360px;
            text-align: center;
            margin: 5px;

        }
        h2 {
            margin-bottom: 10px;
            color: #188875;
        }
        p {
            color: #666666;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #188875;
            font-size: 14px;
            font-weight: 600;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #188875;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #134737;
            border: none;
            border-radius: 14px;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
            margin-top: 20px;
        }
        button:hover {
            background-color: #345249;
        }
        .error-msg {
            color: #dc3545;
            font-size: 13px;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>

<div class="login-box">

    <div style="display: flex; justify-content: center; margin-bottom: 20px;">
        <!-- <img src="/logo.png" alt="Logo" style="width: 340px; height: auto; padding-bottom: 10px;"> -->
        <img src="/logo2.png" alt="Logo" style="width: 280px; height: auto; padding-bottom: 10px;">
    </div>

    <h2>Kiosk WIFI Login to Internet</h2>
    <p>กรุณากรอกบัญชีผู้ใช้งานเพื่อเข้าสู่อินเทอร์เน็ต</p>
    
    <form id="wlcLoginForm" method="post" action="">
        <div class="input-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="ชื่อผู้ใช้งาน" required>
        </div>
        
        <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="รหัสผ่าน" required>
        </div>
        
        <button type="submit" id="loginBtn">Login</button>
    </form>
    
    <!-- <div id="errorMessage" class="error-msg">
        ไม่พบพารามิเตอร์การเชื่อมต่อจากระบบเครือข่าย (Missing switch_url)
    </div> -->
</div>

<script>
    // ฟังก์ชันช่วยดึงค่าพารามิเตอร์ (Query String) จาก URL
    function getUrlParameter(name) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(name);
    }

    // ทำงานทันทีเมื่อหน้าเว็บโหลดเสร็จ
    window.onload = function() {
        const switchUrl = getUrlParameter('switch_url');
        const form = document.getElementById('wlcLoginForm');
        const loginBtn = document.getElementById('loginBtn');
        const errorDiv = document.getElementById('errorMessage');

        if (switchUrl) {
            // นำค่า Virtual IP ของ WLC (switch_url) มาใส่ใน action ของ form
            form.action = switchUrl;
            console.log("WLC Redirect Target Set To: " + switchUrl);
        } else {
            // หากไม่มีค่า switch_url จะทำการปิดปุ่มล็อกอินเพื่อความปลอดภัย และแสดง Error
            // loginBtn.disabled = true;
            // loginBtn.style.backgroundColor = '#cccccc';
            // loginBtn.style.cursor = 'not-allowed';
            // errorDiv.style.display = 'block';
        }
    };
</script>

</body>
</html>
